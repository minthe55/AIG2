<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz - Faune & Flore d'Australie</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 2rem; background: #f4f8f2; color: #1e2a1f; }
    .container { max-width: 800px; margin: auto; background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 8px 20px rgba(0,0,0,.08); }
    h1 { margin-top: 0; color: #245c2a; }
    .question { margin-bottom: 1.5rem; }
    .question h3 { margin-bottom: .75rem; }
    label { display: block; margin: .35rem 0; cursor: pointer; }
    button { background: #2f7d34; color: #fff; border: 0; padding: .8rem 1.2rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #25652a; }
    #result { margin-top: 1.5rem; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz : Faune & Flore d'Australie</h1>
    <p>Répondez aux 10 questions puis cliquez sur <strong>Voir mon score</strong>.</p>

    <form id="quizForm"></form>
    <button id="scoreBtn" type="button">Voir mon score</button>
    <div id="result"></div>
  </div>

  <script>
    const questions = [
      {
        q: "1) Quel animal est connu pour porter ses petits dans une poche ?",
        options: ["Le koala", "Le wombat", "Le kangourou", "L'émeu"],
        answer: 2
      },
      {
        q: "2) Quel arbre est emblématique et très répandu en Australie ?",
        options: ["Le baobab", "L'eucalyptus", "Le chêne", "Le cèdre"],
        answer: 1
      },
      {
        q: "3) Quel mammifère australien pond des œufs ?",
        options: ["Le dingo", "L'ornithorynque", "Le quokka", "Le wallaby"],
        answer: 1
      },
      {
        q: "4) Quel oiseau ne vole pas et est natif d'Australie ?",
        options: ["Le casoar", "Le kiwi", "L'émeu", "Le kakapo"],
        answer: 2
      },
      {
        q: "5) La Grande Barrière de Corail est surtout connue pour :",
        options: ["Ses lions de mer", "Ses mangroves", "Ses récifs coralliens", "Ses manchots"],
        answer: 2
      },
      {
        q: "6) Lequel de ces animaux est un prédateur introduit menaçant la faune locale ?",
        options: ["Le renard roux", "Le koala", "Le possum", "Le casoar"],
        answer: 0
      },
      {
        q: "7) Quelle plante australienne est connue pour ses fleurs en forme de goupillon ?",
        options: ["Le banksia", "Le callistemon", "Le grevillea", "L'acacia"],
        answer: 1
      },
      {
        q: "8) Quel est l'animal emblématique figurant sur les armoiries australiennes avec le kangourou ?",
        options: ["Le wombat", "Le dingo", "Le cacatoès", "L'émeu"],
        answer: 3
      },
      {
        q: "9) Quel biome couvre une grande partie de l'intérieur australien ?",
        options: ["La toundra", "La savane/aride désertique", "La forêt boréale", "La taïga"],
        answer: 1
      },
      {
        q: "10) Quel petit marsupial australien est célèbre pour son " +
          "air souriant sur les photos ?",
        options: ["Le bilby", "Le quokka", "Le numbat", "Le bandicoot"],
        answer: 1
      }
    ];

    const form = document.getElementById('quizForm');

    questions.forEach((item, i) => {
      const block = document.createElement('div');
      block.className = 'question';
      const title = document.createElement('h3');
      title.textContent = item.q;
      block.appendChild(title);

      item.options.forEach((opt, j) => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="radio" name="q${i}" value="${j}"> ${opt}`;
        block.appendChild(label);
      });

      form.appendChild(block);
    });

    document.getElementById('scoreBtn').addEventListener('click', () => {
      let score = 0;
      questions.forEach((item, i) => {
        const checked = document.querySelector(`input[name="q${i}"]:checked`);
        if (checked && Number(checked.value) === item.answer) {
          score++;
        }
      });

      const result = document.getElementById('result');
      result.textContent = `Votre score : ${score}/10`;
    });
  </script>
</body>
</html>
